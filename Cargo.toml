[package]
name = "rtty"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A GPU terminal emulator on GPUI and rtty-vt"

[dependencies]
futures = "0.3"
# runtime_shaders: compile the Metal shaders at startup, so building needs no
# offline Metal toolchain (Xcode 26 ships it as a separate download).
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
libc = "0.2"
# The dock's attention on a bell, and macOS notifications (which need rtty in an app bundle).
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSString", "NSError", "NSSet", "NSURL"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
portable-pty = "0.9"
regex = "1"
rtty-vt = { path = "vt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
