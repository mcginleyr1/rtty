[package]
name = "rtty"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A GPU terminal emulator on GPUI and rtty-vt"

[dependencies]
futures = "0.3"
# runtime_shaders: compile the Metal shaders at startup, so building needs no
# offline Metal toolchain (Xcode 26 ships it as a separate download).
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# `global_hotkey`, through Carbon's RegisterEventHotKey, which needs no Accessibility permission.
global-hotkey = "0.9"
# The frames GPUI's images are made of, for kitty graphics; the version gpui uses.
image = { version = "0.25", default-features = false }
libc = "0.2"
# The dock's attention on a bell and its progress badge, macOS notifications (which need rtty in
# an app bundle), the log's Cmd chords as AppKit hands them over, an Option that is not Alt
# typing through the window's text input, the menu bar as AppKit has it, rtty becoming and
# ceasing to be the active app, and the clipboard question's sheet, whose keys both deny.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSButton", "NSCell", "NSControl", "NSDockTile", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSResponder", "NSTextInputContext", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSDate", "NSGeometry", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "NSError", "NSSet", "NSURL"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
portable-pty = "0.9"
# The window's NSView, for `--script`'s `nskey`.
raw-window-handle = "0.6"
regex = "1"
rtty-vt = { path = "vt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Two of gpui's dependencies at their last releases, each with a line that will become an error in
# a future Rust: patches/README.md.
[patch.crates-io]
block = { path = "patches/block" }
proc-macro-error2 = { path = "patches/proc-macro-error2" }
