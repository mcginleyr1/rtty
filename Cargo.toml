[package]
name = "rtty"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A GPU terminal emulator on GPUI and rtty-vt"

[dependencies]
futures = "0.3"
# runtime_shaders: compile the Metal shaders at startup, so building needs no
# offline Metal toolchain (Xcode 26 ships it as a separate download).
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
portable-pty = "0.9"
rtty-vt = { path = "vt" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
