name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # rtty is macOS only (GPUI's Metal renderer). Its runtime_shaders feature compiles the shaders
    # at startup, so the build needs no offline Metal compiler.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust stable with clippy and rustfmt
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            vt
      - run: brew install just
      - run: just verify
